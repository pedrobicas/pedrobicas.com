    <script>
      (function () {
        // Links antigos (#/projetos/slug) vão para a rota real (/projetos/slug).
        var hash = location.hash;
        if (hash.indexOf('#/') === 0) {
          location.replace(hash.slice(1).split('?')[0] || '/');
          return;
        }
        var root = document.documentElement;
        var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
        root.classList.add(reduce ? 'rm' : 'js-anim');
        // A abertura só roda na primeira visita da sessão à home.
        var seen = false;
        try {
          seen = sessionStorage.getItem('pb-boot') === '1';
        } catch (error) {
          seen = false;
        }
        var home = location.pathname === '/' || location.pathname === '/index.html';
        if (reduce || seen || !home) root.classList.add('no-intro');
      })();
    </script>
