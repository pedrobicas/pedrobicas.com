<main class="app-shell">
  <nav class="app-switcher" aria-label="Alternar areas do site">
    <a routerLink="/home" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" class="switcher-link">
      <i class="fas fa-sitemap" aria-hidden="true"></i>
      <span>Portfólio</span>
    </a>
    <a routerLink="/resume" routerLinkActive="active" class="switcher-link">
      <i class="fas fa-file-lines" aria-hidden="true"></i>
      <span>Currículo</span>
    </a>
  </nav>

  <div class="app-frame">
    <router-outlet></router-outlet>
  </div>
</main>
