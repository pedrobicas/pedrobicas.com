<button class="terminal-launcher" type="button" *ngIf="!isTerminalOpen" (click)="openTerminal()" title="Terminal">
  <span class="launcher-core">
    <i class="fas fa-terminal" aria-hidden="true"></i>
  </span>
  <span class="launcher-tooltip">Terminal</span>
</button>

<section class="floating-terminal-overlay" *ngIf="isTerminalOpen" aria-label="Terminal do portfolio">
  <div class="floating-terminal">
    <header class="terminal-header">
      <div class="terminal-title">
        <i class="fas fa-terminal" aria-hidden="true"></i>
        <span>Pedro Terminal</span>
      </div>
      <button class="window-btn" type="button" (click)="closeTerminal()" aria-label="Fechar terminal">
        <i class="fas fa-xmark" aria-hidden="true"></i>
      </button>
    </header>

    <div class="terminal-body">
      <div class="command-hints" *ngIf="!outputLines.length">
        <button class="hint-item" type="button" *ngFor="let command of quickCommands" (click)="executeQuickCommand(command)">
          {{ command }}
        </button>
      </div>

      <div class="console-output">
        <div class="output-line" *ngFor="let line of outputLines" [class]="line.type">
          <span class="timestamp">{{ line.timestamp }}</span>
          <span class="content">{{ line.content }}</span>
        </div>
      </div>

      <form class="terminal-footer" (ngSubmit)="executeCommand()">
        <span>pedro@portfolio:~$</span>
        <input type="text" name="command" [(ngModel)]="currentCommand" autocomplete="off" aria-label="Comando do terminal">
      </form>
    </div>
  </div>
</section>
