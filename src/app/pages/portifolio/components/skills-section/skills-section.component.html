<section class="skills-section" id="skills" #skillsSection>
  <div class="section-headline">
    <div>
      <span class="section-kicker">02 / Stack</span>
      <h2 class="section-title">Stack de trabalho</h2>
    </div>
    <p>
      Tecnologias que aparecem nos meus projetos e na rotina de desenvolvimento: interfaces, APIs, dados, integração e operação.
    </p>
  </div>

  <div class="category-filters" aria-label="Filtrar habilidades">
    <button class="filter-pill" type="button" [class.active]="selectedCategory() === 'all'" (click)="filterByCategory('all')">Todas</button>
    <button class="filter-pill" *ngFor="let category of skillCategories" type="button" [class.active]="selectedCategory() === category.name" (click)="filterByCategory(category.name)">
      {{ category.name }}
    </button>
  </div>

  <div class="category-grid">
    <article class="category-card" *ngFor="let category of skillCategories; let i = index">
      <span class="category-index">{{ i + 1 | number:'2.0' }}</span>
      <h3>{{ category.name }}</h3>
      <p>{{ category.description }}</p>
      <strong>{{ category.skills.length }} tecnologias</strong>
    </article>
  </div>

  <div class="icon-grid" aria-label="Lista de tecnologias">
    <button class="icon-cell"
            *ngFor="let skill of filteredIcons(); let i = index"
            type="button"
            (mouseenter)="onIconEnter(i)"
            (mouseleave)="onIconLeave()"
            [class.dimmed]="hoveredIndex() !== null && hoveredIndex() !== i">
      <span class="skill-icon-box" aria-hidden="true"><i class="skill-icon" [ngClass]="skill.icon"></i></span>
      <span>{{ skill.name }}</span>
    </button>
  </div>
</section>
