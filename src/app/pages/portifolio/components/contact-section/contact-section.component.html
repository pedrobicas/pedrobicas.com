<section class="contact-section" id="contact">
  <div class="contact-layout">
    <div class="contact-copy">
      <span class="section-kicker">05 / Contato</span>
      <h2 class="section-title">Contato direto</h2>
      <p>
        Para conversar sobre projetos, colaboração ou algum contexto técnico, use o formulário ou os links. O contato fica direto, sem fricção.
      </p>

      <div class="contact-links">
        <a href="mailto:pedro.bicas14&#64;gmail.com">
          <i class="fas fa-envelope" aria-hidden="true"></i>
          pedro.bicas14&#64;gmail.com
        </a>
        <a href="tel:+5511993585087">
          <i class="fas fa-phone" aria-hidden="true"></i>
          +55 (11) 99358-5087
        </a>
        <a href="https://linkedin.com/in/pedrobicas" target="_blank" rel="noopener noreferrer">
          <i class="fab fa-linkedin-in" aria-hidden="true"></i>
          LinkedIn
        </a>
      </div>
    </div>

    <form [formGroup]="contactForm!" (ngSubmit)="onFormSubmit()" class="contact-form" novalidate>
      <div class="form-row">
        <label>
          <span>Nome</span>
          <input type="text" formControlName="name" placeholder="Seu nome" [class.error]="hasError('name')">
          <small *ngIf="hasError('name')">{{ getErrorMessage('name') }}</small>
        </label>

        <label>
          <span>Email</span>
          <input type="email" formControlName="email" placeholder="voce@email.com" [class.error]="hasError('email')">
          <small *ngIf="hasError('email')">{{ getErrorMessage('email') }}</small>
        </label>
      </div>

      <div class="form-row">
        <label>
          <span>Assunto</span>
          <select formControlName="subject" [class.error]="hasError('subject')">
            <option value="">Selecione</option>
            <option value="freelance">Projeto freelance</option>
            <option value="job-opportunity">Contato profissional</option>
            <option value="collaboration">Colaboração</option>
            <option value="consulting">Consultoria</option>
          </select>
          <small *ngIf="hasError('subject')">{{ getErrorMessage('subject') }}</small>
        </label>

        <label>
          <span>Tipo</span>
          <select formControlName="projectType" [class.error]="hasError('projectType')">
            <option value="">Selecione</option>
            <option value="frontend">Frontend</option>
            <option value="backend">Backend/API</option>
            <option value="dashboard">Dashboard/Dados</option>
            <option value="fullstack">Produto full-stack</option>
          </select>
          <small *ngIf="hasError('projectType')">{{ getErrorMessage('projectType') }}</small>
        </label>
      </div>

      <label class="message-field">
        <span>Mensagem</span>
        <textarea rows="7" formControlName="message" placeholder="Conte o objetivo, prazo e o que já existe hoje..." [class.error]="hasError('message')"></textarea>
        <small *ngIf="hasError('message')">{{ getErrorMessage('message') }}</small>
        <em>{{ messageCharCount }}/{{ maxMessageLength }}</em>
      </label>

      <button type="submit" class="submit-button" [disabled]="contactForm?.invalid || submitting">
        <span *ngIf="!submitting">Enviar mensagem</span>
        <span *ngIf="submitting"><i class="fas fa-spinner fa-spin" aria-hidden="true"></i> Enviando</span>
      </button>

      <div class="form-message success" *ngIf="submitSuccess" [@slideIn]>
        Mensagem enviada. Obrigado pelo contato.
      </div>
      <div class="form-message error" *ngIf="submitError" [@slideIn]>
        {{ submitError }}
      </div>
    </form>
  </div>
</section>
